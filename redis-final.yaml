apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: final-redis-task
  labels:
    env: production  # 이 줄을 추가해 보세요!
  namespace: argocd
spec:
  project: default
  source:
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 18.x.x
  destination:
    server: "https://kubernetes.default.svc"
    namespace: redis-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
