apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: final-redis-task
  namespace: argocd
spec:
  project: default
  source:
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 18.x.x
  destination:
    server: "https://kubernetes.default.svc"
    namespace: redis-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
